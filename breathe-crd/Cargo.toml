[package]
name = "breathe-crd"
version = "0.1.29"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The MemoryBand CRD (breathe.pleme.io/v1) — the typed per-target enrollment contract; the controller reconciles only declared bands (theory/BREATHE.md §4)."

[dependencies]
breathe-control = { path = "../breathe-control", version = "0.1.29" }
breathe-provider = { path = "../breathe-provider", version = "0.1.29" }
breathe-auction = { path = "../breathe-auction", version = "0.1.29" }
# The BREATHABILITY contract's ISOLATION algebra — the canonical home of
# `QosClass` / `WorkloadClass` and the seal. `RequestBandSpec`'s `qosTarget` /
# `workloadClass` are JsonSchema MIRRORS of those two enums (this crate's own
# `PromotionMode`↔`outorga::PromotionMode` precedent: the CRD surface needs
# schemars, which the contract crate deliberately does not carry), with a total
# conversion and a drift test that iterates the upstream's `ALL`.
breathe-invariant = { path = "../crates/breathe-invariant", version = "0.1.29" }
# The generic progressive-authority promotion FSM (shadow → confirm → effect,
# + a fleet freeze) — a k8s-free lift of THIS crate's own `Band` promotion
# lifecycle, extracted 2026-06-30 into formigueiro so it and breathe share one
# tested FSM.
#
# REGISTRY DEP, NOT A GIT REV (changed 2026-07-27). The previous line pinned
# `git = "https://github.com/pleme-io/formigueiro", rev = "88b91e58…"` with the
# comment "Not yet on crates.io" — stale: outorga has been published since
# 2026-07-17, and the pinned rev IS the `release: workspace v0.1.1` commit, so
# this is the same source by a resolvable path rather than a different version.
#
# THE GIT PIN WAS A REAL, LATENT BREAK, not a style issue. breathe is a PUBLIC
# repo and formigueiro is PRIVATE, so a credential-less builder — every public
# CI runner, every outside contributor, every fresh clone — could not resolve
# this dependency at all:
#     revision 88b91e58… not found
#     failed to authenticate when downloading repository
# It looked green only because `Swatinem/rust-cache` carried a warm
# ~/.cargo/git between runs; the passing `cargo test --workspace` job was a
# CACHE ARTIFACT, not evidence the dependency resolved. It surfaced the moment
# a job ran without that cache.
#
# It also made AUTO-RELEASE structurally impossible: crates.io refuses git
# dependencies, so breathe-crd could never be published while this line stood —
# the "git= dep freezes a published crate and silently defers its downstream"
# class this fleet has hit before.
outorga = "0.1.1"
kube = { version = "0.96", features = ["derive"], default-features = false }
k8s-openapi = { version = "0.23", features = ["latest"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[lints]
workspace = true
