# breathe-resize — the in-place pod resize (`pods/{name}/resize`), as pure
# functions over the pod's JSON.
#
# LIFTED 2026-09-30 out of breathe-kube so there is ONE home for the shape of
# an in-place resize: which containers may be resized without a restart
# (`resizePolicy`), the QoS-preserving `resources` block a resize writes, the
# request-only block, the body the subresource takes, and whether the kubelet
# has converged on it. Two consumers: breathe-kube (the limit and request
# actuators, over kube-rs) and ensaio's visita (a reversible guest-trial
# fixture, over kubectl). The I/O stays with each consumer; the decisions live
# here, so they cannot drift apart.
#
# Depends on breathe-control for `Unit`/`Quantity` (the one parser and renderer
# of k8s quantities) and on serde_json. Nothing async, no kube client.
[package]
name = "breathe-resize"
version = "0.1.58"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["drzzln <drzzln@protonmail.com>"]
repository = "https://github.com/pleme-io/breathe"
description = "The in-place pod resize as pure functions — resizePolicy restart check, QoS-preserving limit block, request block, the pods/{name}/resize body, and the convergence check against status.containerStatuses. Shared by breathe-kube and ensaio visita."

[lib]
name = "breathe_resize"
path = "src/lib.rs"

[dependencies]
breathe-control = { path = "../../breathe-control", version = "0.1.58" }
serde_json = "1"

[lints.clippy]
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
