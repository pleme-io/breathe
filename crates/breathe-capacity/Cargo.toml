[package]
name = "breathe-capacity"
version = "0.1.58"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["drzzln <drzzln@protonmail.com>"]
repository = "https://github.com/pleme-io/breathe"
description = "A pure, deterministic capacity-raise planner: turns an intent to grow memory, CPU, replicas or a node pool into ordered, bounded steps checked for node fit, cluster headroom, HPA replica shift, rollout surge and connection budgets, and edits the values file in place."

[lib]
name = "breathe_capacity"
path = "src/lib.rs"

[[bin]]
name = "breathe-capacity"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
breathe-control = { path = "../../breathe-control", version = "0.1.58" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
shikumi = { version = "0.1" }

[features]
default = ["cli"]
cli = ["dep:clap", "shikumi/cli"]

[lints.clippy]
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
