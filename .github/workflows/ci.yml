# The gate that did not exist.
#
# This repo had three workflows — image / helm-release / retirada-ci-watch —
# and NONE of them ran the test suite. 882 tests were enforced by nothing on
# push. That is the root cause behind the `spec.dryRun` inversion
# (breathe@76924b0, 2026-06-19): the commit's own "Tests 28/28" was a local run
# that nothing re-ran, and the suite would not have caught it anyway (no test
# pinned the authored-shape → PromotionMode mapping; see
# breathe-crd/tests/gate_matrix.rs).
#
# Landing S4's forcing functions into an unenforced suite would be decorative,
# so the enforcement lands with them.
#
# ─── SCOPE, stated honestly ───────────────────────────────────────────────────
#
# BLOCKING here: `cargo test --workspace` and `cargo build --workspace`. These
# are exactly the two commands verified locally before this file was written.
#
# NOT blocking here: clippy. `[workspace.lints.clippy] pedantic = "warn"` spans
# 26 crates. This header used to say the backlog size was UNKNOWN because the
# Nix-provided toolchain ships no clippy component (`cargo clippy` → "no such
# command"). **It is no longer unknown — it was measured on 2026-07-26: 901
# warnings, 0 errors, across the whole workspace.**
#
# How to run it locally on a Nix box, since the missing component is what kept
# this unmeasured for so long — clippy IS in the store, just not on PATH, and it
# must MATCH the cargo in use (cargo 1.91.1 → clippy 0.1.91):
#
#     PATH=$(dirname $(ls -d /nix/store/*clippy-1.91.1/bin/cargo-clippy)):$PATH \
#       cargo clippy --workspace --all-targets
#
# The composition of those 901: ~358 `doc_markdown` (missing backticks), ~140
# numeric-cast lints, ~37 missing `# Errors` sections — i.e. it is a documentation
# and cast-annotation backlog, not a correctness one. That is WHY flipping
# `continue-on-error: false` is still not done here: `-D warnings` would redden
# main on 901 pre-existing findings, and a gate that reddens main on its first
# run is a gate that gets removed. Burning the backlog down is a separate,
# sizeable piece of work, and it must land BEFORE the flip, not after.
#
# The org directive (`cargo clippy -- -D warnings`) is the destination; this is
# a named interim with a measured number attached, not a silent downgrade.
#
# Also NOT here: `cargo fmt --check` (no rustfmt.toml is committed, so there is
# no agreed format to check against).
#
# ─── runner ───────────────────────────────────────────────────────────────────
#
# ubuntu-latest, NOT the camelot ARC pool image.yml uses. Deliberate: a test gate
# whose runner can be broken (image.yml's own header records CAMELOT_IMAGE_RUNNER
# outages) is a gate that silently stops gating — the exact failure mode this
# file exists to end. A plain cargo test needs no Nix substituter, no registry
# credentials and no cluster.
name: ci

on:
  push:
    branches: [main, "camelot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked

  # BLOCKING. A PUBLIC repo must be buildable by the PUBLIC.
  #
  # Until 2026-07-27 breathe (public) depended on `outorga` by git rev from
  # pleme-io/formigueiro (PRIVATE). A credential-less builder — every outside
  # contributor, every fresh clone, every cache-cold runner — could not resolve
  # it:
  #     revision 88b91e58… not found
  #     failed to authenticate when downloading repository
  #
  # It read GREEN for weeks because `Swatinem/rust-cache` carried a warm
  # ~/.cargo/git between runs, so `cargo test --workspace` passed on a CACHE
  # ARTIFACT rather than on a resolvable dependency. It surfaced only when the
  # crd-drift job below ran for the first time with a cold cache.
  #
  # TWO THINGS MAKE THIS GATE NON-VACUOUS, and both are load-bearing:
  #   1. NO rust-cache step. A cached ~/.cargo/git would let this pass exactly
  #      the way the test job already does — the gate would inherit the very
  #      blindness it exists to remove.
  #   2. Credentials are actively STRIPPED (no `token` in the git config, no
  #      GITHUB_TOKEN in env). Inheriting the checkout token would let a
  #      private dep resolve here and fail for everyone else.
  #
  # Verified by a RED RUN against the pre-fix commit (UNREP §II.3 standing
  # rule): with `outorga` still on the git rev this job fails with the exact
  # authentication error above; with the registry dep it passes.
  #
  # SCOPE, honestly: this proves every dependency RESOLVES without credentials.
  # It does not prove they are pinned or reproducible — `shikumi` and `kanchi`
  # remain UNPINNED git deps on public repos (breathe-config/Cargo.toml). Those
  # resolve fine here, so this gate is silent on them by design; converting
  # them to registry deps is a separate migration (the lockfile sits at
  # shikumi 0.1.73 vs 0.1.345 published — 272 versions, not a one-liner).
  public-buildable:
    name: public repo builds without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # DELIBERATELY NO Swatinem/rust-cache — see note 1 above.
      - name: fetch every dependency with no credentials
        env:
          GITHUB_TOKEN: ""
          CARGO_NET_GIT_FETCH_WITH_CLI: "false"
        run: |
          git config --global --unset-all url."https://x-access-token:".insteadOf 2>/dev/null || true
          if ! cargo fetch --locked; then
            echo "::error::A dependency could not be resolved WITHOUT credentials."
            echo "::error::breathe is a PUBLIC repo — every dep must be reachable by the public."
            echo "::error::A git dep on a PRIVATE repo also makes crates.io publishing impossible."
            echo "::error::Fix: depend on the published crate version, not a git rev."
            exit 1
          fi
          echo "all dependencies resolve without credentials"

  # BLOCKING. The chart's CRD manifest is crdgen OUTPUT, and until 2026-07-27
  # nothing checked that it still matched the Rust types it is generated from.
  #
  # Found by walking into it: adding `IsolationBandSpec.targetNodeSelector`
  # required hand-copying crdgen's output into charts/pleme-breathe/crds/
  # bands.yaml. Forgetting that step is silent AND severe — the apiserver
  # prunes fields absent from a CRD schema, so a band authored with a
  # `targetNodeSelector` would apply cleanly, report no error, silently drop
  # the selector, resolve zero selected nodes, and fall back to hostname-only
  # behaviour. The operator would see a green `Protecting` band protecting
  # nothing. That is precisely the false-green class the field itself was
  # added to eliminate, reintroduced one layer down in the packaging.
  #
  # This is blocking from its first run rather than advisory because the file
  # was brought into sync in the same commit that added this job — so it
  # cannot redden main on a pre-existing backlog, which is the failure mode
  # the clippy job below is still waiting out.
  crd-drift:
    name: chart CRDs match crdgen output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: regenerate and diff
        run: |
          cargo run -q -p breathe-crd --bin crdgen --locked > /tmp/crds.yaml
          if ! diff -u charts/pleme-breathe/crds/bands.yaml /tmp/crds.yaml; then
            echo "::error::charts/pleme-breathe/crds/bands.yaml is STALE vs the Rust CRD types."
            echo "::error::A field present in Rust but absent from the chart CRD is PRUNED by the"
            echo "::error::apiserver — the CR applies cleanly and the field silently vanishes."
            echo "::error::Regenerate: cargo run -p breathe-crd --bin crdgen > charts/pleme-breathe/crds/bands.yaml"
            exit 1
          fi
          echo "chart CRDs are in sync with crdgen"

  # Advisory. The backlog IS now measured (901 warnings, 0 errors — see the
  # header); what blocks the flip is burning it down, not knowing its size.
  # Flipping `continue-on-error: false` is still the one-line change that makes
  # this a real gate — do it in the same PR that reaches zero, never before.
  clippy:
    name: cargo clippy (advisory — see ci.yml header)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
