# Build + push EVERY breathe OCI image on merge to main.
#
# runner: resolves from vars.PRIVATE_BUILDER_RUNNER, falls back to
# private-estate-builder-pleme (was rio-build-01 -- confirmed dead 2026-07-17, 0
# registered runners fleet-wide; see pangea-operator's release.yml for the
# sibling fix + the full routing writeup), with the in-cluster sui
# super-cache wired as a Nix substituter -- see the private estate skill's
# "pleme-io-org runner pool" section for the full routing pattern + why
# (private-estate-builder-pleme, the pleme-io-org ARC scale set on one cluster's own
# 100%-spot builder floor, registered at githubConfigUrl:
# https://github.com/pleme-io into the org's Default runner group).
#
# breathe images stay PRIVATE (package visibility set out-of-band).
#
# CVE gate: each image is scanned (blocking, zero-tolerance) immediately
# after its own push -- see the cve-scan-* jobs below.
#
# ★ AUTOBUMP + the private estate CHANNEL extension (2026-07-11). Every push emits a
# sortable, exact, immutable tag — never :latest as a deploy source (org ★
# AUTOBUMP directive). Two channels share one image (one ghcr package, one
# ImageRepository per app):
#   main         -> amd64-r<run>-<sha>          (the fleet-wide stream)
#   the private estate/**   -> amd64-private-estate-r<run>-<sha>  (private-estate-only stream)
# A private-estate/* branch build never touches main's tag lineage or any other
# cluster's ImagePolicy (its pattern requires the "private-estate-" infix main's
# never carries, and vice versa) -- so the private estate can run ahead of / diverged
# from the fleet by pushing to a private-estate/* branch, with zero risk to rio or
# any other subscriber. See k8s/clusters/rio/infrastructure/flux-image-
# automation/RUNBOOK.md for the ImageRepository/ImagePolicy/
# ImageUpdateAutomation shape this tag scheme is designed to feed; the private estate's
# own equivalent lives under infrastructure/flux-image-automation/ in its own
# cluster's GitOps tree.
name: image

on:
  push:
    branches: [main, "isolated/**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.*"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:
    inputs:
      runnerOverride:
        description: >-
          Escape hatch for when PRIVATE_BUILDER_RUNNER's scale set is broken
          (e.g. its ClusterSecretStore credential isn't provisioned yet —
          see task tracker "isolated-builder-pleme ARC scale set broken").
          Set to a real GitHub-hosted label (e.g. ubuntu-24.04) to bypass
          it for one manual run. Empty (default) = normal var-driven
          selection, unaffected. Never rio-build-01 for isolated images
          (org rule) — this input exists so the fallback never silently
          becomes rio.
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  controller:
    name: breathe-controller image → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: image
      imageName: pleme-io/breathe-controller
      tag: amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
      additionalTags: ${{ startsWith(github.ref_name, 'isolated/') && 'amd64-isolated-latest' || 'amd64-latest' }}
      # NO explicit runner (2026-07-27). Left EMPTY so substrate's
      # image-push.yml routes through runner-resolve's VISIBILITY-AWARE
      # default: private-repo callers land on the org's self-hosted pool,
      # public-repo callers keep free GitHub-hosted minutes.
      #
      # WHY THIS LINE HAD TO GO. breathe is a PUBLIC repo, and this line
      # forced `vars.PRIVATE_BUILDER_RUNNER` = the self-hosted builder pool --
      # a SELF-HOSTED label. GitHub does not assign public-repository jobs
      # to self-hosted runners (a fork PR could otherwise execute arbitrary
      # code on our cluster), so every build queued FOREVER: 4 runs stuck
      # since 07-27T01:03, none failed, nothing alerted.
      #
      # Every layer downstream read healthy while the chain was dead --
      # the job said `queued` (not failed), the ARC listener honestly
      # reported `assigned job: 0` and scaled to zero, ImageRepository and
      # ImagePolicy both Ready=True correctly finding the newest MATCHING
      # tag. There just had been no amd64-r<n> tag since r174, so the private estate's
      # controller sat 21 commits behind with nothing anywhere saying why.
      # NOTE (corrected 2026-07-28): `runnerOverride` is now INERT. Removing
      # the `runner:` line severed its ONLY consumer -- the input is still
      # declared (line ~46) but nothing reads it, so a dispatch with
      # runnerOverride set does nothing. An earlier revision of this comment
      # asserted the opposite in all three jobs; that was wrong. Re-wiring it
      # means passing `runner: ${{ inputs.runnerOverride }}` ONLY when the
      # input is non-empty, so the visibility-aware default still applies by
      # default -- not restoring the unconditional pin that caused the
      # public-repo queue-forever bug.
      extraSubstituters: ${{ vars.PRIVATE_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.PRIVATE_SUI_REQUIRE_SIGS || vars.CAMELOT_SUI_REQUIRE_SIGS }}
    secrets: inherit
  host-agent:
    name: breathe-host-agent image → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: agent-image
      imageName: pleme-io/breathe-host-agent
      tag: amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
      additionalTags: ${{ startsWith(github.ref_name, 'isolated/') && 'amd64-isolated-latest' || 'amd64-latest' }}
      # NO explicit runner (2026-07-27). Left EMPTY so substrate's
      # image-push.yml routes through runner-resolve's VISIBILITY-AWARE
      # default: private-repo callers land on the org's self-hosted pool,
      # public-repo callers keep free GitHub-hosted minutes.
      #
      # WHY THIS LINE HAD TO GO. breathe is a PUBLIC repo, and this line
      # forced `vars.PRIVATE_BUILDER_RUNNER` = the self-hosted builder pool --
      # a SELF-HOSTED label. GitHub does not assign public-repository jobs
      # to self-hosted runners (a fork PR could otherwise execute arbitrary
      # code on our cluster), so every build queued FOREVER: 4 runs stuck
      # since 07-27T01:03, none failed, nothing alerted.
      #
      # Every layer downstream read healthy while the chain was dead --
      # the job said `queued` (not failed), the ARC listener honestly
      # reported `assigned job: 0` and scaled to zero, ImageRepository and
      # ImagePolicy both Ready=True correctly finding the newest MATCHING
      # tag. There just had been no amd64-r<n> tag since r174, so the private estate's
      # controller sat 21 commits behind with nothing anywhere saying why.
      # NOTE (corrected 2026-07-28): `runnerOverride` is now INERT. Removing
      # the `runner:` line severed its ONLY consumer -- the input is still
      # declared (line ~46) but nothing reads it, so a dispatch with
      # runnerOverride set does nothing. An earlier revision of this comment
      # asserted the opposite in all three jobs; that was wrong. Re-wiring it
      # means passing `runner: ${{ inputs.runnerOverride }}` ONLY when the
      # input is non-empty, so the visibility-aware default still applies by
      # default -- not restoring the unconditional pin that caused the
      # public-repo queue-forever bug.
      extraSubstituters: ${{ vars.PRIVATE_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.PRIVATE_SUI_REQUIRE_SIGS || vars.CAMELOT_SUI_REQUIRE_SIGS }}
    secrets: inherit
  api-server:
    name: breathe-api-server image → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: api-server-image
      imageName: pleme-io/breathe-api-server
      tag: amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
      additionalTags: ${{ startsWith(github.ref_name, 'isolated/') && 'amd64-isolated-latest' || 'amd64-latest' }}
      # NO explicit runner (2026-07-27). Left EMPTY so substrate's
      # image-push.yml routes through runner-resolve's VISIBILITY-AWARE
      # default: private-repo callers land on the org's self-hosted pool,
      # public-repo callers keep free GitHub-hosted minutes.
      #
      # WHY THIS LINE HAD TO GO. breathe is a PUBLIC repo, and this line
      # forced `vars.PRIVATE_BUILDER_RUNNER` = the self-hosted builder pool --
      # a SELF-HOSTED label. GitHub does not assign public-repository jobs
      # to self-hosted runners (a fork PR could otherwise execute arbitrary
      # code on our cluster), so every build queued FOREVER: 4 runs stuck
      # since 07-27T01:03, none failed, nothing alerted.
      #
      # Every layer downstream read healthy while the chain was dead --
      # the job said `queued` (not failed), the ARC listener honestly
      # reported `assigned job: 0` and scaled to zero, ImageRepository and
      # ImagePolicy both Ready=True correctly finding the newest MATCHING
      # tag. There just had been no amd64-r<n> tag since r174, so the private estate's
      # controller sat 21 commits behind with nothing anywhere saying why.
      # NOTE (corrected 2026-07-28): `runnerOverride` is now INERT. Removing
      # the `runner:` line severed its ONLY consumer -- the input is still
      # declared (line ~46) but nothing reads it, so a dispatch with
      # runnerOverride set does nothing. An earlier revision of this comment
      # asserted the opposite in all three jobs; that was wrong. Re-wiring it
      # means passing `runner: ${{ inputs.runnerOverride }}` ONLY when the
      # input is non-empty, so the visibility-aware default still applies by
      # default -- not restoring the unconditional pin that caused the
      # public-repo queue-forever bug.
      extraSubstituters: ${{ vars.PRIVATE_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.PRIVATE_SUI_REQUIRE_SIGS || vars.CAMELOT_SUI_REQUIRE_SIGS }}
    secrets: inherit

  # Zero-tolerance CVE gate on each JUST-published image (2026-07-17 —
  # breathe had never scanned its own published artifacts; same gap closed
  # in pangea-operator's release.yml the same pass). Real, blocking gate
  # from the start (no advisory grace period) — one job per image so a
  # finding in one component never masks the others. Tier-honest: this is
  # a POST-publish gate (image-push.yml builds+pushes as one step; a real
  # pre-publish gate needs image-scan's `local-archive:` input wired ahead
  # of the push, a change to the shared substrate reusable, not this repo).
  cve-scan-controller:
    name: zero-tolerance CVE scan — breathe-controller
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - uses: pleme-io/actions/image-scan@main
        with:
          image-ref: ghcr.io/pleme-io/breathe-controller:amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
          fail-on-severity: HIGH

  host-agent-arm64:
    name: breathe-host-agent image (arm64) → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: agent-image
      imageName: pleme-io/breathe-host-agent
      tag: arm64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
      additionalTags: ${{ startsWith(github.ref_name, 'isolated/') && 'arm64-isolated-latest' || 'arm64-latest' }}
      # ADDED 2026-08-02. Until now this image published amd64 tags ONLY, and the
      # consequence was measured the first time the DaemonSet rolled on
      # private-estate-eks: 22 pods came up Running and one CrashLoopBackOff'd on an
      # arm64 c6g.large with
      #   exec /nix/store/...-x86_64-unknown-linux-musl/bin/breathe-host-agent:
      #   exec format error
      # The workaround shipped there is a `kubernetes.io/arch: amd64`
      # nodeSelector, which keeps the agent healthy but leaves every arm64 node
      # UNWATCHED -- including the private estate's builder-arm64 pool, which runs
      # m7g.2xlarge ON-DEMAND and is exactly the idle-prone shape the agent's
      # node-waste reporter exists to catch. This job is what lets that
      # nodeSelector be dropped.
      #
      # EXPLICIT runner, and it must be a GITHUB-HOSTED arm64 one. The obvious
      # move -- point this at the private estate's scale-to-zero ARC arm64 pool
      # (the self-hosted builder pool-arm64, minRunners 0) -- CANNOT work: breathe
      # is a PUBLIC repo, and GitHub never assigns public-repository jobs to
      # self-hosted runners, because a fork PR could otherwise execute arbitrary
      # code on the cluster. That was already tried on the amd64 job and it did
      # not fail loudly; it queued FOREVER, 4 runs stuck since 07-27T01:03 with
      # nothing alerting. See the amd64 job's own comment above.
      #
      # Native-arch, not cross-compiled, per image-push.yml's own header: an
      # off-target build mislabels the arch and exec-format-errors at runtime,
      # which is the failure this job exists to end.
      runner: ubuntu-24.04-arm
      extraSubstituters: ${{ vars.PRIVATE_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.PRIVATE_SUI_REQUIRE_SIGS || vars.CAMELOT_SUI_REQUIRE_SIGS }}
    secrets: inherit

  host-agent-manifest:
    name: breathe-host-agent multi-arch index → ghcr.io
    needs: [host-agent, host-agent-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The two arch legs above push SEPARATE images under amd64-<tag> and
      # arm64-<tag>. A Kubernetes DaemonSet has ONE image field, so per-arch tags
      # cannot cover a mixed-arch cluster: whichever tag is chosen, the other
      # architecture exec-format-errors. That is not hypothetical -- it is what
      # happened on one cluster-eks the first time this DaemonSet rolled, and the
      # workaround was an arch nodeSelector that left every arm64 node unwatched.
      #
      # This composes both legs into ONE multi-arch OCI index, so a single tag
      # resolves per-node and the nodeSelector can be dropped.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pleme-io/actions/manifest-list-join@main
        with:
          repo: ghcr.io/pleme-io/breathe-host-agent
          tag: ${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
          arch-refs: amd64=ghcr.io/pleme-io/breathe-host-agent:amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }},arm64=ghcr.io/pleme-io/breathe-host-agent:arm64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}

  cve-scan-host-agent:
    name: zero-tolerance CVE scan — breathe-host-agent
    needs: host-agent
    runs-on: ubuntu-latest
    steps:
      - uses: pleme-io/actions/image-scan@main
        with:
          image-ref: ghcr.io/pleme-io/breathe-host-agent:amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
          fail-on-severity: HIGH

  cve-scan-api-server:
    name: zero-tolerance CVE scan — breathe-api-server
    needs: api-server
    runs-on: ubuntu-latest
    steps:
      - uses: pleme-io/actions/image-scan@main
        with:
          image-ref: ghcr.io/pleme-io/breathe-api-server:amd64-${{ startsWith(github.ref_name, 'isolated/') && 'isolated-' || '' }}r${{ github.run_number }}-${{ github.sha }}
          fail-on-severity: HIGH
