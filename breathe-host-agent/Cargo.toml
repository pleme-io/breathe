[package]
name = "breathe-host-agent"
version = "0.1.29"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The breathe host agent — the HANDS. A privileged DaemonSet pod that runs the full host reconcile loop locally on its node: watches ArcBand/CgroupBand, reads its BreatheNodePool for the L2 ceilings + master write switch, and applies host-dimension decisions via HostCluster (systemd/sysfs) strictly within the nodeBudget envelopes. Shadow-first by construction."

[[bin]]
name = "breathe-host-agent"
path = "src/main.rs"

[dependencies]
breathe-control = { path = "../breathe-control", version = "0.1.29" }
breathe-provider = { path = "../breathe-provider", version = "0.1.29" }
breathe-core = { path = "../breathe-core", version = "0.1.29" }
breathe-crd = { path = "../breathe-crd", version = "0.1.29" }
breathe-host = { path = "../breathe-host", version = "0.1.29" }
breathe-runtime = { path = "../breathe-runtime", version = "0.1.29" }
kube = { version = "0.96", features = ["client", "runtime", "derive", "rustls-tls", "unstable-runtime"], default-features = false }
# Explicit process-wide CryptoProvider install (main.rs) -- see
# breathe-controller/Cargo.toml for the full story.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# The fleet configuration surface (★★ CONFIGURATION MANAGEMENT). Registry dep,
# not a git pin: shikumi is published, and a git pin of a published crate is the
# name-version key collision that silently shadows one source with the other.
shikumi = "0.1"
thiserror = "2"
breathe-nodewaste = { path = "../breathe-nodewaste", version = "0.1.29" }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

[lints]
workspace = true
